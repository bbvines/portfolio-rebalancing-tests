name: Portfolio Rebalancing - CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  # ── Job 1: PMD static code analysis ──────────────────────────────────────
  pmd:
    name: PMD Code Analysis
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run PMD analysis
        run: mvn pmd:check --no-transfer-progress

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/pmd.xml
          retention-days: 7

  # ── Job 2: TestNG tests + Allure report ──────────────────────────────────
  test:
    name: Run TestNG Tests & Publish Allure Report
    runs-on: ubuntu-latest
    needs: pmd

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run tests
        run: mvn test --no-transfer-progress

      - name: Generate Allure report
        if: always()
        run: mvn allure:report --no-transfer-progress

      - name: Upload Allure results (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 7

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report/
          retention-days: 7

      - name: Publish Allure report to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          destination_dir: allure-report

      - name: Print Allure Report URL
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "=========================================="
          echo "Allure Report published successfully!"
          echo "View report at:"
          echo "https://bbvines.github.io/portfolio-rebalancing-tests/allure-report"
          echo "=========================================="

  # ── Job 3: Docker build and test ─────────────────────────────────────────
  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: pmd

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t portfolio-rebalancing-tests \
            .

      - name: Run tests inside Docker
        run: |
          docker run \
            --platform linux/amd64 \
            --rm \
            -v ${{ github.workspace }}/target:/app/target \
            portfolio-rebalancing-tests \
            mvn test allure:report --no-transfer-progress

      - name: Upload Docker Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-allure-report
          path: target/allure-report/
          retention-days: 7
